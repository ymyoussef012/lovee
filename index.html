<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>😉 جاهزه</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- القلوب المتحركة -->
  <div id="hearts"></div>

  <main class="page">

    <section class="login-card">

      <!-- القلب الكبير -->
      <div class="big-heart"></div>

      <!-- محتوى القلب -->
      <div class="content">

        <!-- صورة البروفايل -->
        <div class="profile-container">
          <img
            src="profile.jpg"
            alt="profile"
            class="profile"
          >
        </div>

        <h1>😉 جاهزه</h1>

        <p class="subtitle">
          😍 كل الي بينا هنا
        </p>

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="off"
        >

        <button id="unlockBtn">
          💕 Unlock 💕
        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
